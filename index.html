<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Lincoln Tech lab grades</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
  :root {
    --red: #C8102E;
    --bg: #0f1216;
    --card: #161b21;
    --line: rgba(255,255,255,.12);
    --text: #f4efe6;
    --muted: #9aa3ad;
    --gold: #d4b45a;
    --ok: #30d158;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0 auto;
    max-width: 480px;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px 28px;
    background: var(--bg);
    color: var(--text);
    font: 500 16px/1.35 "IBM Plex Sans", system-ui, sans-serif;
  }
  h1 { font-size: 1.35rem; margin: 12px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .label { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 6px; }
  select, textarea, input[type=text] {
    width: 100%; margin: 0 0 10px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #3a4654; background: #1b2229; color: var(--text); font: inherit;
  }
  input[type=range] { width: 100%; margin: 0 0 10px; accent-color: var(--red); }
  .btn {
    min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid #3a4654;
    background: #1b2229; color: var(--text); font: 650 15px/1.2 inherit; cursor: pointer;
  }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .bigscan { width: 100%; min-height: 64px; font-size: 1.15rem; margin: 0 0 14px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row select { flex: 1; margin: 0; }
  .row .btn { width: auto; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .actions .btn { flex: 1 1 120px; }
  .scan { position: relative; }
  video { width: 100%; border-radius: 16px; background: #000; margin: 0 0 10px; max-height: 240px; object-fit: cover; }
  video.off { display: none; }
  .frame { display: none; position: absolute; left: 50%; top: 42%; width: 180px; height: 180px; transform: translate(-50%,-50%); border: 2px solid var(--red); border-radius: 16px; pointer-events: none; }
  .frame.on { display: block; }
  .status { text-align: center; font-weight: 650; color: var(--ok); min-height: 1.2em; }
  .status.bad { color: var(--bad); }
  .person { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
  .person p { margin: 2px 0 0; color: #c9d0d6; font-size: 14px; }
  .person.on { outline: 2px solid var(--gold); border-radius: 12px; padding: 10px; }
  .btns { display: flex; gap: 6px; }
  .btns .btn { width: auto; min-width: 72px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 12px; }
  .grade { font-size: 64px; font-weight: 700; text-align: center; line-height: 1; margin: 0; }
  .sharp { font-size: 40px; }
  .log { max-height: 240px; overflow: auto; }
  .log div { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .fine { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }
  .shot { position: fixed; inset: 0; z-index: 20; background: #fff; color: #14181c; overflow: auto; text-align: center; padding: 12px 16px 28px; }
  .shot canvas { width: min(100%, 440px); height: auto; background: #fff; }
  .shot p { margin: 10px auto; max-width: 440px; }
  .shot .btn { display: block; width: min(100%, 440px); margin: 8px auto; background: #1c1c1e; color: #fff; }
  .shot .btn.primary { background: var(--red); }
  .labs { display: flex; flex-direction: column; gap: 8px; margin: 0 0 8px; }
  .lab { display: flex; gap: 8px; align-items: center; }
  .lab.on { outline: 2px solid var(--gold); border-radius: 12px; padding: 4px; }
  .lab input[type=text] { margin: 0; }
  .daynum { width: 88px; flex: 0 0 88px; }
  .count { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 0; }
</style>
</head>
<body>
<h1>Lincoln Tech</h1>
<p class="sub">One code per student, made once for the module. Scan that same code at the end of each lab. The 0 to 100 slider stamps the time.</p>
<div id="app"></div>
<input id="lg-roster-file" type="file" accept="image/*" capture="environment" hidden>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function () {
  "use strict";
  var BUILTIN = {
    hcr200: {
      name: "HCR200 Morning – Advanced Electrical",
      roster: {
        "hcr200-01": "Gray Alcide",
        "hcr200-02": "Mohammed Alshehari",
        "hcr200-03": "Amneyll Estevez",
        "hcr200-04": "Dalonte Jackson",
        "hcr200-05": "Mohammad Kanan",
        "hcr200-06": "Eugene Martin",
        "hcr200-07": "Tyler Moore",
        "hcr200-08": "Joshua Pintella",
        "hcr200-09": "Rashone Stevenson"
      }
    },
    hcr101: {
      name: "HCR101 Night",
      roster: {
        "hcr101-01": "Iyanna Austin", "hcr101-02": "Samir Austin", "hcr101-03": "Aidan Buckley",
        "hcr101-04": "Janelies Casiano", "hcr101-05": "Christopher Colon", "hcr101-06": "Travis Crosby",
        "hcr101-07": "Anthony Deleon", "hcr101-08": "Isaiah Gallashaw", "hcr101-09": "Amiir Griffin",
        "hcr101-10": "Hyzear Henry", "hcr101-11": "Michael Hillian", "hcr101-12": "Javian McKnight",
        "hcr101-13": "Tycorie McKnight", "hcr101-14": "Andrew Melnyk", "hcr101-15": "Angel Pena-Perez",
        "hcr101-16": "Vincent Perkins", "hcr101-17": "Chaz Sterling Jr", "hcr101-18": "Izale Thomas",
        "hcr101-19": "Corey Worthy", "hcr101-20": "Zackary Wynne"
      }
    }
  };

  var gClass = "hcr200";
  var gDay = 1;
  var gStudent = null;
  var gScore = 100;
  var gSharp = 10;
  var gNotes = "";
  var gOpen = "";
  var gScanning = false;
  var gScanFor = "";
  var gKeepScan = false;
  var gPicture = "";
  var gStatus = "";
  var gStatusBad = false;
  var gReading = false;
  var gDraftName = "";
  var gDraftNames = "";
  var scanTimer = null;
  var scanStream = null;
  var app = document.getElementById("app");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      if (c === "&") return "&" + "amp;";
      if (c === "<") return "&" + "lt;";
      if (c === ">") return "&" + "gt;";
      if (c === '"') return "&" + "quot;";
      return "&" + "#39;";
    });
  }
  function customClasses() {
    try { return JSON.parse(localStorage.getItem("gs-classes") || "{}"); }
    catch (e) { return {}; }
  }
  function saveCustom(map) { localStorage.setItem("gs-classes", JSON.stringify(map)); }
  function gradeMeta(id) {
    if (BUILTIN[id]) return BUILTIN[id];
    var c = customClasses()[id];
    return c ? { name: c.name || "Class", roster: c.roster || {} } : null;
  }
  function rosterOf(id) {
    var m = gradeMeta(id);
    return (m && m.roster) || {};
  }
  function calendarDay() { return new Date().toISOString().slice(0, 10); }
  function loadBook() {
    try {
      var rows = JSON.parse(localStorage.getItem("gs-book") || "[]");
      return Array.isArray(rows) ? rows : [];
    } catch (e) { return []; }
  }
  function saveBook(rows) { localStorage.setItem("gs-book", JSON.stringify(rows)); }
  function allDays() {
    try { return JSON.parse(localStorage.getItem("gs-days") || "{}"); }
    catch (e) { return {}; }
  }
  function dayId() { return gClass + ":" + gDay; }
  function dayState() {
    var d = allDays()[dayId()];
    if (!d) d = { title: "", labs: ["Lab 1"], active: 0 };
    if (!Array.isArray(d.labs) || !d.labs.length) d.labs = ["Lab 1"];
    d.labs = d.labs.map(function (n, i) { return String(n || ("Lab " + (i + 1))).slice(0, 40); });
    if (d.active < 0 || d.active >= d.labs.length) d.active = 0;
    d.title = String(d.title || "").slice(0, 60);
    return d;
  }
  function saveDay(d) {
    var all = allDays();
    all[dayId()] = d;
    localStorage.setItem("gs-days", JSON.stringify(all));
    localStorage.setItem("gs-last-day-" + gClass, String(gDay));
  }
  function activeLab() {
    var d = dayState();
    return d.labs[d.active] || "Lab 1";
  }
  function dayRows() {
    return loadBook().filter(function (r) {
      return r.classId === gClass && Number(r.day) === Number(gDay);
    });
  }
  function prior(id, lab) {
    var hit = null;
    dayRows().forEach(function (r) {
      if (r.id === id && r.lab === lab) hit = r;
    });
    return hit;
  }
  function rosterLines(text) {
    var skip = /^(name|names|student|students|roster|class|hvac|lincoln|instructor|page|date|id)$/i;
    var seen = {};
    var out = [];
    String(text || "").split(/\n/).forEach(function (raw) {
      var line = raw.replace(/[|]/g, " ").replace(/\s+/g, " ").trim();
      line = line.replace(/^\d+[\.\)\-\s]+/, "");
      line = line.replace(/[^A-Za-z .'\-]/g, " ").replace(/\s+/g, " ").trim();
      if (line.length < 3 || !/[A-Za-z]/.test(line) || skip.test(line)) return;
      var words = line.split(" ").filter(Boolean);
      if (words.length < 2 || words.length > 4) return;
      var key = line.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      out.push(line.slice(0, 40));
    });
    return out.slice(0, 40);
  }
  function readRoster(file) {
    gReading = true;
    gScanning = false;
    gScanFor = "";
    gStudent = null;
    gStatus = "Reading the names on the roster.";
    gStatusBad = false;
    paint();
    if (!window.Tesseract) {
      gReading = false;
      gOpen = "create";
      gStatus = "Type the names. One code each, once for the module.";
      gStatusBad = true;
      paint();
      return;
    }
    window.Tesseract.recognize(file, "eng").then(function (res) {
      var lines = rosterLines(res && res.data && res.data.text);
      gReading = false;
      gOpen = "create";
      gDraftNames = lines.join("\n");
      if (!gDraftName) gDraftName = "HVAC module";
      gStatus = lines.length
        ? lines.length + " names from the picture. Check them, then make the codes once."
        : "No names read. Type them, one per line. The codes are made once.";
      gStatusBad = !lines.length;
      paint();
    }).catch(function () {
      gReading = false;
      gOpen = "create";
      gStatus = "Could not read that picture. Type the names.";
      gStatusBad = true;
      paint();
    });
  }
  function releaseCam() {
    if (scanTimer) clearInterval(scanTimer);
    scanTimer = null;
    if (scanStream) {
      scanStream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
      scanStream = null;
    }
  }
  function csvCell(v) {
    return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  }
  function toCsv(rows) {
    var head = ["Class", "Program day", "Day title", "Lab", "Student ID", "Name", "Lab grade", "Sharp points", "Notes", "Date", "Time"];
    var body = rows.map(function (r) {
      return [r.className, r.day, r.dayTitle || "", r.lab, r.id, r.name, r.grade, r.sharp, r.notes || "", r.date || "", r.time || ""].map(csvCell).join(",");
    });
    return head.join(",") + "\n" + body.join("\n");
  }
  function downloadCsv(name, rows) {
    if (!rows.length) { gStatus = "No grades saved for that sheet."; gStatusBad = true; paint(); return; }
    var blob = new Blob([toCsv(rows)], { type: "text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function cardCanvas(name, className, code) {
    return new Promise(function (ok, fail) {
      if (!window.QRCode || !window.QRCode.toCanvas) { fail(); return; }
      var qr = document.createElement("canvas");
      window.QRCode.toCanvas(qr, code, {
        width: 860, margin: 1, errorCorrectionLevel: "H",
        color: { dark: "#14181c", light: "#ffffff" }
      }).then(function () {
        var canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1440;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1080, 1440);
        ctx.textAlign = "center";
        ctx.fillStyle = "#C8102E";
        ctx.font = "700 40px Arial, sans-serif";
        ctx.fillText("LINCOLN TECH", 540, 110);
        ctx.fillStyle = "#14181c";
        var size = 78;
        ctx.font = "700 " + size + "px Arial, sans-serif";
        while (size > 40 && ctx.measureText(name).width > 960) {
          size -= 4;
          ctx.font = "700 " + size + "px Arial, sans-serif";
        }
        ctx.fillText(name, 540, 210);
        ctx.font = "36px Arial, sans-serif";
        var words = String(className || "").split(" ");
        var lines = [];
        var line = "";
        words.forEach(function (w) {
          var next = line ? line + " " + w : w;
          if (line && ctx.measureText(next).width > 960) { lines.push(line); line = w; }
          else line = next;
        });
        if (line) lines.push(line);
        lines.slice(0, 2).forEach(function (ln, i) { ctx.fillText(ln, 540, 280 + i * 46); });
        ctx.drawImage(qr, 110, 390);
        ctx.font = "32px Arial, sans-serif";
        ctx.fillText("Save this picture. Do not crop the white.", 540, 1340);
        ok(canvas);
      }).catch(fail);
    });
  }

  function printCards() {
    var meta = gradeMeta(gClass);
    var roster = rosterOf(gClass);
    var ids = Object.keys(roster);
    if (!meta || !ids.length) { gStatus = "The cards did not draw."; gStatusBad = true; paint(); return; }
    Promise.all(ids.map(function (id) {
      return cardCanvas(roster[id], meta.name, id).then(function (canvas) {
        return canvas.toDataURL("image/png");
      });
    })).then(function (urls) {
      var w = window.open("", "_blank");
      var html = urls.map(function (u) {
        return '<section style="page-break-after:always;text-align:center"><img alt="" src="' + u + '" style="width:7.2in;height:auto"/></section>';
      }).join("");
      if (!w) return;
      w.document.write("<!DOCTYPE html><title>Lincoln Tech grade cards</title><body style='margin:0'>" + html + "</body>");
      w.document.close();
      w.focus();
      setTimeout(function () { w.print(); }, 400);
    }).catch(function () {
      gStatus = "The cards did not draw.";
      gStatusBad = true;
      paint();
    });
  }

  function openStudent(id, roster) {
    var lab = activeLab();
    var old = prior(id, lab);
    gScanning = false;
    gScanFor = "";
    gStudent = { id: id, name: roster[id] };
    gScore = old ? old.grade : 100;
    gSharp = old ? old.sharp : 10;
    gNotes = old ? (old.notes || "") : "";
    gStatus = "";
    gOpen = "";
  }

  function startScan(roster) {
    var video = app.querySelector("#lg-video");
    if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      gScanning = false;
      gStatus = "This phone has no camera here.";
      gStatusBad = true;
      paint();
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }).then(function (stream) {
      if (!gScanning) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      scanStream = stream;
      video.srcObject = stream;
      video.classList.remove("off");
      var play = video.play();
      if (play && play.catch) play.catch(function () {});
      if (!("BarcodeDetector" in window)) {
        gStatus = "This browser cannot read a code. Use Chrome.";
        gStatusBad = true;
        var say = app.querySelector(".status");
        if (say) { say.textContent = gStatus; say.className = "status bad"; }
        return;
      }
      var det = new BarcodeDetector({ formats: ["qr_code"] });
      scanTimer = setInterval(function () {
        if (!gScanning) return;
        det.detect(video).then(function (codes) {
          if (!gScanning || !codes || !codes[0] || !codes[0].rawValue) return;
          var id = String(codes[0].rawValue).trim();
          var say = app.querySelector(".status");
          if (gScanFor && id !== gScanFor) {
            gStatus = roster[id] ? "That's " + roster[id] + ", not " + roster[gScanFor] + "." : "That code is not this student.";
            gStatusBad = true;
            if (say) { say.textContent = gStatus; say.className = "status bad"; }
            return;
          }
          if (!roster[id]) {
            gStatus = "That code is not in this class.";
            gStatusBad = true;
            if (say) { say.textContent = gStatus; say.className = "status bad"; }
            return;
          }
          openStudent(id, roster);
          paint();
        }).catch(function () {});
      }, 350);
    }).catch(function (err) {
      gScanning = false;
      gStatus = "Camera blocked. Open this file in Chrome, tap the lock icon, and set Camera to Allow. Or use a local server (http not file).";
      gStatusBad = true;
      paint();
    });
  }

  function paint() {
    releaseCam();
    var meta = gradeMeta(gClass) || gradeMeta("hcr200");
    if (!gradeMeta(gClass)) gClass = "hcr200";
    var roster = rosterOf(gClass);
    var ids = Object.keys(roster);
    var classes = Object.keys(BUILTIN).map(function (id) { return { id: id, name: BUILTIN[id].name }; })
      .concat(Object.keys(customClasses()).map(function (id) {
        var c = customClasses()[id];
        return { id: id, name: (c && c.name) || "Class" };
      }));
    var d = dayState();
    var lab = d.labs[d.active];
    var book = loadBook();
    var today = dayRows();
    var marks = {};
    today.forEach(function (r) {
      marks[r.id] = marks[r.id] || {};
      marks[r.id][r.lab] = r;
    });
    app.innerHTML =
      '<p class="label">Class</p>' +
      '<div class="row"><select id="lg-class">' + classes.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === gClass ? " selected" : "") + ">" + esc(c.name) + "</option>";
      }).join("") + '</select><button type="button" class="btn" id="lg-del">Delete</button></div>' +
      '<button type="button" class="btn primary bigscan" id="lg-photo">' +
      (gReading ? "Reading the roster…" : "Photograph the roster") + "</button>" +
      '<p class="fine">One picture of the roster. One code per student. Made once for the whole module. Scan that same code at the end of every lab.</p>' +
      '<p class="label">Program day</p>' +
      '<div class="row"><input id="lg-day" class="daynum" type="number" min="1" max="200" value="' + gDay + '"/>' +
      '<input id="lg-title" type="text" maxlength="60" placeholder="What this day is" value="' + esc(d.title) + '"/></div>' +
      '<p class="label">Labs this day</p>' +
      '<div class="labs">' + d.labs.map(function (name, i) {
        return '<div class="lab' + (i === d.active ? " on" : "") + '">' +
          '<button type="button" class="btn' + (i === d.active ? " primary" : "") + '" data-use="' + i + '">' + (i === d.active ? "Grading" : "Grade this") + "</button>" +
          '<input type="text" maxlength="40" data-rename="' + i + '" value="' + esc(name) + '"/>' +
          (d.labs.length > 1 ? '<button type="button" class="btn" data-drop="' + i + '">Remove</button>' : "") +
          "</div>";
      }).join("") + "</div>" +
      '<button type="button" class="btn" id="lg-add-lab">Add a lab</button>' +
      '<p class="fine">Grade one lab for the class. Then switch to the next lab and scan again.</p>' +
      '<button type="button" class="btn primary bigscan" id="lg-any">' +
      (gScanning && !gScanFor ? "Close camera" : "Scan whoever is ready") + "</button>" +
      '<div class="actions"><button type="button" class="btn" id="lg-print">Print cards</button>' +
      '<button type="button" class="btn" id="lg-new">New class</button></div>' +
      '<div class="scan"><video id="lg-video" class="' + (gScanning ? "" : "off") + '" autoplay playsinline muted></video>' +
      '<div class="frame' + (gScanning ? " on" : "") + '"></div></div>' +
      (gStatus ? '<p class="status' + (gStatusBad ? " bad" : "") + '">' + esc(gStatus) + "</p>" : "") +
      '<p class="label">Roster · day ' + gDay + " · " + esc(lab) + "</p>" +
      (ids.length ? ids.map(function (id) {
        var line = d.labs.map(function (name) {
          var hit = marks[id] && marks[id][name];
          return esc(name) + " " + (hit ? esc(hit.grade) + " · " + esc(hit.time || "") : "—");
        }).join(" · ");
        return '<div class="person' + (gScanFor === id && gScanning ? " on" : "") + '"><div><strong>' + esc(roster[id]) +
          "</strong><p>" + line + '</p></div><div class="btns"><button type="button" class="btn" data-pic="' + esc(id) + '">Picture</button>' +
          '<button type="button" class="btn primary" data-scan="' + esc(id) + '">' +
          (gScanning && gScanFor === id ? "Stop" : "Scan") + "</button></div></div>";
      }).join("") : "<p>No names in this class.</p>") +
      (gOpen === "create"
        ? '<div class="card"><strong>Make the codes once</strong><input id="lg-cname" type="text" maxlength="48" placeholder="Module or class name" value="' + esc(gDraftName) + '"/>' +
          '<p class="label">Names from the roster, one per line</p><textarea id="lg-cnames" rows="8" placeholder="First Last">' + esc(gDraftNames) + '</textarea>' +
          '<div class="actions"><button type="button" class="btn primary" id="lg-save-class">Make the codes</button>' +
          '<button type="button" class="btn" id="lg-close-create">Close</button></div></div>'
        : "") +
      (gStudent
        ? '<div class="card"><h3>' + esc(gStudent.name) + "</h3><p>Day " + gDay + " · " + esc(lab) + '</p><p class="label">Grade, 0 to 100</p><p class="grade" id="lg-num">' + gScore +
          '</p><input id="lg-score" type="range" min="0" max="100" step="1" value="' + gScore + '"/>' +
          '<p class="fine">Slide it, then save. The time is stamped on this lab.</p>' +
          '<p class="label">Sharp points</p><p class="grade sharp" id="lg-sharp">' + gSharp +
          '</p><input id="lg-sharpin" type="range" min="0" max="10" step="1" value="' + gSharp + '"/>' +
          '<textarea id="lg-note" rows="2" maxlength="240" placeholder="Notes, optional">' + esc(gNotes) + "</textarea>" +
          '<div class="actions"><button type="button" class="btn primary" id="lg-save">Save</button>' +
          '<button type="button" class="btn" id="lg-cancel">Cancel</button></div></div>'
        : "") +
      '<div class="card"><strong>Saved for day ' + gDay + "</strong><div class=\"log\">" +
      (today.length ? today.map(function (r) {
        return "<div><strong>" + esc(r.name) + "</strong> · " + esc(r.lab) + "<br>Lab " + esc(r.grade) + " · Sharp " + esc(r.sharp) +
          " · " + esc(r.time || "") + (r.notes ? " · " + esc(r.notes) : "") + "</div>";
      }).join("") : "<div>Nothing saved for this day yet.</div>") +
      '</div><div class="actions"><button type="button" class="btn" id="lg-csv-day">Export this day</button>' +
      '<button type="button" class="btn" id="lg-csv-all">Export every grade</button></div></div>' +
      '<p class="count">' + book.length + " grade" + (book.length === 1 ? "" : "s") + " saved on this phone.</p>" +
      '<p class="fine">Do not make a new code for the next lab. Export the sheet, then type the grades in.</p>' +
      (gPicture && roster[gPicture]
        ? '<div class="shot"><canvas id="lg-shot" width="1080" height="1440"></canvas>' +
          "<p>Press and hold the picture. Save it to Photos. Leave the white border.</p>" +
          '<button type="button" class="btn primary" id="lg-shot-save">Save picture</button>' +
          '<button type="button" class="btn" id="lg-shot-close">Close</button></div>'
        : "");
    bind(roster, meta);
    if (gScanning) startScan(roster);
    if (gPicture && roster[gPicture]) {
      var shot = app.querySelector("#lg-shot");
      cardCanvas(roster[gPicture], meta.name, gPicture).then(function (drawn) {
        if (shot && drawn) shot.getContext("2d").drawImage(drawn, 0, 0);
      }).catch(function () {});
    }
  }

  function bind(roster, meta) {
    app.querySelector("#lg-class").onchange = function () {
      gClass = this.value;
      var last = parseInt(localStorage.getItem("gs-last-day-" + gClass) || "1", 10);
      gDay = last >= 1 ? last : 1;
      gStudent = null; gOpen = ""; gStatus = ""; gScanning = false; gScanFor = ""; gKeepScan = false; gPicture = "";
      paint();
    };
    app.querySelector("#lg-day").onchange = function () {
      var n = parseInt(this.value, 10);
      gDay = n >= 1 && n <= 200 ? n : 1;
      gStudent = null;
      saveDay(dayState());
      paint();
    };
    app.querySelector("#lg-title").onchange = function () {
      var d = dayState();
      d.title = this.value.trim().slice(0, 60);
      saveDay(d);
    };
    app.querySelectorAll("[data-use]").forEach(function (b) {
      b.onclick = function () {
        var d = dayState();
        d.active = parseInt(b.getAttribute("data-use"), 10) || 0;
        saveDay(d);
        gStudent = null;
        paint();
      };
    });
    app.querySelectorAll("[data-rename]").forEach(function (input) {
      input.onchange = function () {
        var i = parseInt(input.getAttribute("data-rename"), 10) || 0;
        var d = dayState();
        var prev = d.labs[i];
        var next = input.value.trim().slice(0, 40) || prev;
        if (next === prev) return;
        d.labs[i] = next;
        var book = loadBook().map(function (r) {
          if (r.classId === gClass && Number(r.day) === Number(gDay) && r.lab === prev) r.lab = next;
          return r;
        });
        saveBook(book);
        saveDay(d);
        paint();
      };
    });
    app.querySelectorAll("[data-drop]").forEach(function (b) {
      b.onclick = function () {
        var i = parseInt(b.getAttribute("data-drop"), 10) || 0;
        var d = dayState();
        if (d.labs.length < 2) return;
        d.labs.splice(i, 1);
        if (d.active >= d.labs.length) d.active = d.labs.length - 1;
        saveDay(d);
        paint();
      };
    });
    app.querySelector("#lg-add-lab").onclick = function () {
      var d = dayState();
      d.labs.push("Lab " + (d.labs.length + 1));
      d.active = d.labs.length - 1;
      saveDay(d);
      gStudent = null;
      paint();
    };
    app.querySelector("#lg-del").onclick = function () {
      if (BUILTIN[gClass]) { gStatus = "Those two classes stay."; gStatusBad = true; paint(); return; }
      if (!window.confirm("Delete this class? Grades already saved stay in the export.")) return;
      var map = customClasses();
      delete map[gClass];
      saveCustom(map);
      gClass = "hcr200"; gDay = 1; gStudent = null; gStatus = "";
      paint();
    };
    app.querySelector("#lg-any").onclick = function () {
      if (gScanning && !gScanFor) { gScanning = false; gKeepScan = false; gStatus = ""; paint(); return; }
      gScanFor = ""; gKeepScan = true; gScanning = true; gStudent = null; gOpen = "";
      gStatus = "Point at whoever is ready. This scan is " + activeLab() + ".";
      gStatusBad = false;
      paint();
    };
    app.querySelector("#lg-print").onclick = printCards;
    var photoBtn = app.querySelector("#lg-photo");
    if (photoBtn) photoBtn.onclick = function () {
      if (gReading) return;
      var input = document.getElementById("lg-roster-file");
      if (input) input.click();
    };
    app.querySelector("#lg-new").onclick = function () {
      gScanning = false;
      if (gOpen === "create") { gOpen = ""; paint(); return; }
      gOpen = "create";
      if (!gDraftNames) { gDraftName = ""; gDraftNames = ""; }
      paint();
    };
    var closeCreate = app.querySelector("#lg-close-create");
    if (closeCreate) closeCreate.onclick = function () { gOpen = ""; paint(); };
    var saveClass = app.querySelector("#lg-save-class");
    if (saveClass) saveClass.onclick = function () {
      var name = (app.querySelector("#lg-cname").value || "").trim().slice(0, 48);
      var lines = (app.querySelector("#lg-cnames").value || "").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      if (!name || !lines.length) { gStatus = "Put a class name and at least one student."; gStatusBad = true; paint(); return; }
      var id = "custom_" + Date.now().toString(36);
      var next = {};
      lines.forEach(function (n, i) { next[id + "-" + String(i + 1).padStart(2, "0")] = n.slice(0, 40); });
      var map = customClasses();
      map[id] = { name: name, roster: next };
      saveCustom(map);
      gClass = id; gDay = 1; gOpen = ""; gStudent = null;
      gDraftName = ""; gDraftNames = "";
      gStatus = "Codes are made. The same code is scanned at the end of every lab in this module."; gStatusBad = false;
      paint();
    };
    app.querySelectorAll("[data-pic]").forEach(function (b) {
      b.onclick = function () { gPicture = b.getAttribute("data-pic") || ""; gScanning = false; gScanFor = ""; paint(); };
    });
    app.querySelectorAll("[data-scan]").forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute("data-scan");
        if (gScanning && gScanFor === id) { gScanning = false; gScanFor = ""; gKeepScan = false; gStatus = ""; paint(); return; }
        gScanFor = id; gKeepScan = false; gScanning = true; gStudent = null; gOpen = "";
        gStatus = "Point at " + (roster[id] || "their") + "’s picture. This scan is " + activeLab() + ".";
        gStatusBad = false;
        paint();
      };
    });
    var shotClose = app.querySelector("#lg-shot-close");
    if (shotClose) shotClose.onclick = function () { gPicture = ""; paint(); };
    var shotSave = app.querySelector("#lg-shot-save");
    if (shotSave) shotSave.onclick = function () {
      var canvas = app.querySelector("#lg-shot");
      if (!canvas) return;
      var fileName = String(roster[gPicture] || "student").replace(/[^\w]+/g, "-").replace(/^-|-$/g, "") + ".png";
      canvas.toBlob(function (blob) {
        if (!blob) return;
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, "image/png");
    };
    var score = app.querySelector("#lg-score");
    var sharp = app.querySelector("#lg-sharpin");
    if (score) score.oninput = function () {
      gScore = Math.max(0, Math.min(100, parseInt(score.value, 10) || 0));
      app.querySelector("#lg-num").textContent = String(gScore);
    };
    if (sharp) sharp.oninput = function () {
      gSharp = Math.max(0, Math.min(10, parseInt(sharp.value, 10) || 0));
      app.querySelector("#lg-sharp").textContent = String(gSharp);
    };
    var note = app.querySelector("#lg-note");
    if (note) note.oninput = function () { gNotes = note.value.slice(0, 240); };
    var save = app.querySelector("#lg-save");
    if (save) save.onclick = function () {
      if (!gStudent) return;
      var d = dayState();
      var labName = d.labs[d.active] || "Lab 1";
      var entry = {
        classId: gClass,
        className: meta.name,
        day: gDay,
        dayTitle: d.title,
        lab: labName,
        id: gStudent.id,
        name: gStudent.name,
        grade: gScore,
        sharp: gSharp,
        notes: gNotes.trim(),
        date: calendarDay(),
        time: new Date().toLocaleTimeString()
      };
      var data = loadBook();
      var idx = -1;
      data.forEach(function (r, i) {
        if (r.classId === entry.classId && Number(r.day) === entry.day && r.lab === entry.lab && r.id === entry.id) idx = i;
      });
      if (idx >= 0) data[idx] = entry; else data.push(entry);
      saveBook(data);
      gStudent = null; gNotes = ""; gScore = 100; gSharp = 10;
      gStatus = gKeepScan ? "Saved. Point at the next picture." : "Saved. It stays on this phone.";
      gStatusBad = false;
      if (gKeepScan) { gScanning = true; gScanFor = ""; }
      paint();
    };
    var cancel = app.querySelector("#lg-cancel");
    if (cancel) cancel.onclick = function () {
      gStudent = null;
      gStatus = gKeepScan ? "Point at whoever is ready." : "";
      gStatusBad = false;
      if (gKeepScan) { gScanning = true; gScanFor = ""; }
      paint();
    };
    app.querySelector("#lg-csv-day").onclick = function () {
      downloadCsv("lincoln-day-" + gDay + "-" + gClass + ".csv", dayRows());
    };
    app.querySelector("#lg-csv-all").onclick = function () {
      downloadCsv("lincoln-all-grades.csv", loadBook());
    };
  }

  var rosterFile = document.getElementById("lg-roster-file");
  if (rosterFile) rosterFile.onchange = function () {
    var file = rosterFile.files && rosterFile.files[0];
    rosterFile.value = "";
    if (file) readRoster(file);
  };
  try {
    var remembered = parseInt(localStorage.getItem("gs-last-day-hcr200") || "1", 10);
    if (remembered >= 1) gDay = remembered;
  } catch (e) {}
  paint();
})();
</script>
</body>
</html>
